name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Smoke check (module exports)
        run: |
          node -e "import('./lib/index.js').then(m => {
            if (typeof m.apply !== 'function') { console.error('missing apply()'); process.exit(1) }
            if (!Array.isArray(m.inject) || !m.inject.includes('skills')) { console.error('missing skills injection'); process.exit(1) }
            if (typeof m.Config !== 'function') { console.error('missing Config schema'); process.exit(1) }
            console.log('exports ok:', Object.keys(m).join(', '))
          })"

      - name: Host behavior tests
        run: pnpm test

      - name: Registry integration + plugin-fiber lifecycle
        run: node test-registry.mjs

      - name: Upstream drift and pin-version check
        run: pnpm run sync:check

      - name: Package contents (runtime files only)
        run: |
          pnpm pack --pack-destination /tmp >/dev/null
          tar -tzf /tmp/dsh-engineering-skills-*.tgz > /tmp/pack.txt
          for path in \
            package/lib/index.js \
            package/skills/manifest.json \
            package/cordis.patch.yml \
            package/UPSTREAM.json \
            package/NOTICE \
            package/LICENSE \
            package/LICENSE-upstream; do
            grep -qx "$path" /tmp/pack.txt || { echo "missing $path"; exit 1; }
          done
          echo "pack ok"
