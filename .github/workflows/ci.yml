name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Behavior, registry/lifecycle and bundle tests
        run: pnpm test

      - name: Upstream drift and pin-version check
        run: pnpm run sync:check

      - name: Packed tarball smoke (contents + import)
        run: |
          pnpm pack --pack-destination /tmp >/dev/null
          tar -tzf /tmp/dsh-engineering-skills-*.tgz > /tmp/pack.txt
          for path in \
            package/lib/index.js \
            package/skills/manifest.json \
            package/cordis.patch.yml \
            package/UPSTREAM.json \
            package/NOTICE \
            package/LICENSE \
            package/LICENSE-upstream; do
            grep -qx "$path" /tmp/pack.txt || { echo "missing $path"; exit 1; }
          done
          rm -rf /tmp/tarball && mkdir -p /tmp/tarball
          tar -xzf /tmp/dsh-engineering-skills-*.tgz -C /tmp/tarball
          ln -s "$PWD/node_modules" /tmp/tarball/package/node_modules
          node -e "import('/tmp/tarball/package/lib/index.js').then(m => { if (typeof m.apply !== 'function' || !m.inject.includes('skills')) { console.error('tarball import failed'); process.exit(1) } console.log('tarball import ok') })"
          node -e "const fs=require('fs'); const p='/tmp/tarball/package'; for (const f of ['lib/index.js','skills/manifest.json','cordis.patch.yml','LICENSE-upstream','NOTICE']) { if (!fs.existsSync(p+'/'+f)) { console.error('missing',f); process.exit(1) } } console.log('tarball files ok')"
